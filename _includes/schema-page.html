{%- assign s = site.data.settings -%}
{%- include page-crumb.html -%}
{%- assign org_id = '/#organization' | absolute_url -%}
<!-- Structured data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "BreadcrumbList",
      "itemListElement": [
        {"@type": "ListItem", "position": 1, "name": "Home", "item": {{ '/' | absolute_url | jsonify }}},
        {%- if crumb_label %}
        {"@type": "ListItem", "position": 2, "name": {{ crumb_label | jsonify }}, "item": {{ crumb_url | absolute_url | jsonify }}},
        {"@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}
        {%- else %}
        {"@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": {{ page.url | absolute_url | jsonify }}}
        {%- endif %}
      ]
    },
    {%- if page.kind == "about" %}
    {
      "@type": "AboutPage",
      "@id": {{ page.url | absolute_url | append: '#webpage' | jsonify }},
      "url": {{ page.url | absolute_url | jsonify }},
      "name": {{ page.title | jsonify }},
      "description": {{ page.summary | jsonify }},
      "inLanguage": "en",
      "about": {"@id": {{ org_id | jsonify }}}
    }
    {%- else %}
    {
      "@type": "Service",
      "@id": {{ page.url | absolute_url | append: '#service' | jsonify }},
      "name": {{ page.service_name | default: page.title | jsonify }},
      "serviceType": {{ page.service_type | default: page.title | jsonify }},
      "description": {{ page.summary | jsonify }},
      "url": {{ page.url | absolute_url | jsonify }},
      "provider": {"@type": "Organization", "@id": {{ org_id | jsonify }}, "name": {{ s.site_name | jsonify }}, "url": {{ '/' | absolute_url | jsonify }}},
      "areaServed": [{"@type": "Country", "name": "India"}, {"@type": "Place", "name": "Worldwide"}]
      {%- if page.audience and page.audience != "" %},
      "audience": {"@type": "BusinessAudience", "audienceType": {{ page.audience | jsonify }}}
      {%- endif %}
    }
    {%- endif %}
    {%- if page.faqs and page.faqs.size > 0 %},
    {
      "@type": "FAQPage",
      "mainEntity": [
        {%- for f in page.faqs %}
        {"@type": "Question", "name": {{ f.q | jsonify }}, "acceptedAnswer": {"@type": "Answer", "text": {{ f.a | jsonify }}}}{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ]
    }
    {%- endif %}
  ]
}
</script>
