<svg class="schematic" viewBox="30 50 545 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scattered product data flowing through a focal point and resolving into a structured digital product">
  <!-- faint grid -->
  <g class="sch-line" stroke-width="1" opacity="0.3">
    <path d="M40 70 H560 M40 190 H560 M40 310 H560 M40 430 H560"/>
    <path d="M170 60 V500 M300 60 V500 M430 60 V500"/>
  </g>

  <!-- scattered raw data fragments (left) -->
  <g class="sch-line" stroke-width="1.4" fill="none">
    <rect class="draw" x="58" y="112" width="56" height="34" rx="7" transform="rotate(-10 86 129)"/>
    <rect class="draw d2" x="126" y="188" width="48" height="30" rx="7" transform="rotate(8 150 203)"/>
    <rect class="draw d2" x="52" y="240" width="62" height="26" rx="7" transform="rotate(-5 83 253)"/>
    <rect class="draw d3" x="136" y="292" width="42" height="42" rx="7" transform="rotate(13 157 313)"/>
  </g>
  <g class="sch-accent-fill" opacity="0.85">
    <circle cx="104" cy="86" r="3.4"/>
    <circle cx="188" cy="150" r="3.4"/>
    <circle cx="66" cy="308" r="3.4"/>
    <circle cx="164" cy="360" r="3.4"/>
  </g>

  <!-- flow curves converging to the focal point -->
  <g class="sch-accent" stroke-width="1.6" fill="none" opacity="0.9">
    <path class="draw d2" d="M118 132 C 224 156, 258 244, 314 284"/>
    <path class="draw d2" d="M152 206 C 232 224, 268 258, 316 288"/>
    <path class="draw d3" d="M110 254 C 214 274, 262 286, 316 294"/>
    <path class="draw d3" d="M166 320 C 244 322, 282 306, 316 300"/>
  </g>

  <!-- focal point: synthesis -->
  <circle class="sch-accent" cx="330" cy="291" r="26" stroke-width="1.5" fill="none" opacity="0.65"/>
  <circle class="sch-fill-surface sch-accent" cx="330" cy="291" r="14" stroke-width="1.6"/>
  <circle class="sch-accent-fill" cx="330" cy="291" r="5.5"/>
  <g class="sch-accent" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M330 253 v-13 M330 329 v13 M292 291 h-13 M368 291 h13"/>
  </g>

  <!-- feed into the product -->
  <path class="sch-accent draw d3" stroke-width="1.6" d="M356 291 H396"/>

  <!-- structured digital product (right) -->
  <rect class="sch-fill-surface sch-ink" x="396" y="176" width="168" height="230" rx="16" stroke-width="1.9"/>
  <path class="sch-line" stroke-width="1.4" d="M396 212 H564"/>
  <circle class="sch-accent-fill" cx="416" cy="194" r="4"/>
  <g class="sch-line" stroke-width="1.4" fill="none" opacity="0.8">
    <rect x="430" y="189" width="64" height="10" rx="5"/>
  </g>
  <g class="sch-line" stroke-width="7" stroke-linecap="round" opacity="0.55">
    <path d="M418 242 H544"/>
    <path d="M418 266 H520"/>
    <path d="M418 290 H536"/>
    <path d="M418 340 H504"/>
    <path d="M418 364 H528"/>
  </g>
  <path class="sch-accent" stroke-width="7" stroke-linecap="round" d="M418 314 H476"/>
</svg>
