{%- assign s = site.data.settings -%}
{%- assign svc = site.data.home.services -%}
{%- assign prod = site.data.home.products -%}
<!-- Structured data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": {{ '/#organization' | absolute_url | jsonify }},
      "name": {{ s.site_name | jsonify }},
      "alternateName": "Made-O",
      "url": {{ '/' | absolute_url | jsonify }},
      "logo": {"@type": "ImageObject", "url": {{ '/assets/img/logo.png' | absolute_url | jsonify }}, "width": 512, "height": 512},
      "image": {{ s.og_image | absolute_url | jsonify }},
      "email": {{ s.email | jsonify }},
      "description": {{ s.seo_description | jsonify }},
      "contactPoint": {"@type": "ContactPoint", "contactType": "sales", "email": {{ s.email | jsonify }}, "availableLanguage": ["English"]},
      "areaServed": [{"@type": "Country", "name": "India"}, {"@type": "Place", "name": "Worldwide"}],
      "knowsAbout": {{ s.expertise | jsonify }},
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Services and products",
        "itemListElement": [
          {%- for i in svc.items %}
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": {{ i.title | jsonify }}, "description": {{ i.text | jsonify }}}},
          {%- endfor %}
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": {{ prod.featured.name | jsonify }}, "description": {{ prod.featured.text | jsonify }}}}
          {%- for i in prod.items %},
          {"@type": "Offer", "itemOffered": {"@type": "Service", "name": {{ i.name | jsonify }}, "description": {{ i.text | jsonify }}}}
          {%- endfor %}
        ]
      }
    },
    {
      "@type": "WebSite",
      "@id": {{ '/#website' | absolute_url | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }},
      "name": {{ s.site_name | jsonify }},
      "inLanguage": "en",
      "publisher": {"@id": {{ '/#organization' | absolute_url | jsonify }}}
    },
    {
      "@type": "WebPage",
      "@id": {{ '/#webpage' | absolute_url | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }},
      "name": {{ s.seo_title | jsonify }},
      "description": {{ s.seo_description | jsonify }},
      "inLanguage": "en",
      "isPartOf": {"@id": {{ '/#website' | absolute_url | jsonify }}},
      "about": {"@id": {{ '/#organization' | absolute_url | jsonify }}},
      "primaryImageOfPage": {"@type": "ImageObject", "url": {{ s.og_image | absolute_url | jsonify }}, "width": 1200, "height": 630}
    }
  ]
}
</script>
