eyebrow: How we work
title: From your product data to a working solution, in four moves.
intro: A short, honest path. You see something real early, and shape it before it scales.
steps:
  - title: Understand
    text: "We map your products, your data, and the people who use them — dealers, engineers, and customers alike."
  - title: Prototype
    text: "We build a working MVP with AI, so you can click through it — not just read about it."
  - title: Validate
    text: "You test it with real users and real data. We refine what matters and drop what doesn't."
  - title: Scale
    text: "We grow the solution into production — flexible enough to keep changing as your business does."
