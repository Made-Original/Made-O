# Pages CMS configuration — https://pagescms.org/docs/configuration/
# Editors sign in at https://app.pagescms.org with GitHub and open this repository.
# Every save is a commit; GitHub Pages rebuilds the site about a minute later.

media:
  input: assets/uploads
  output: /assets/uploads

content:
  # ---------------------------------------------------------------- Insights
  - name: insights
    label: Insights (blog)
    type: collection
    path: _insights
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, category, date, coming_soon]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: seo_title
        label: Google title
        type: string
        description: "Optional shorter title for Google results. Keep under 44 characters: \" | Made Original\" is added after it. Defaults to the title."
      - name: category
        label: Category
        type: string
        description: Short label shown on the card, e.g. "Pump Connect".
        required: true
      - name: summary
        label: Summary
        type: text
        description: One or two sentences. Shown on the card and used as the Google description.
        required: true
      - name: date
        label: Publish date
        type: date
        required: true
      - name: image
        label: Cover image
        type: image
        description: Optional. Landscape (16:9) works best, at least 1200px wide.
      - name: image_alt
        label: Cover image description
        type: string
        description: Describe the image for screen readers and search engines.
      - name: coming_soon
        label: Coming soon
        type: boolean
        description: On = card shows "Publishing soon" and the article is hidden from search. Turn off when the article is written.
        default: false
      - name: published
        label: Show on site
        type: boolean
        description: Turn off to hide this note completely.
        default: true
      - name: body
        label: Article
        type: rich-text

  # ---------------------------------------------------------------- Service, product & industry pages
  - name: solutions
    label: "Pages (services, products, industries, about)"
    type: collection
    path: _solutions
    filename: "{primary}.md"
    format: yaml-frontmatter
    view:
      fields: [title, kind, permalink]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - { name: title, label: Page heading (H1), type: string, required: true }
      - { name: seo_title, label: Google title, type: string, required: true, description: "Shown in Google results. Keep under 44 characters: \" | Made Original\" is added after it." }
      - { name: summary, label: Google description and intro, type: text, required: true, description: "Shown under the heading and in Google results. Keep between 120 and 155 characters." }
      - { name: eyebrow, label: Small label above the heading, type: string, description: "e.g. Service, Industry, Flagship product" }
      - { name: footer_label, label: Short name for footer links, type: string }
      - name: kind
        label: Page type
        type: select
        required: true
        options:
          values:
            - { value: service, label: Service }
            - { value: product, label: Product }
            - { value: industry, label: Industry }
            - { value: about, label: About }
      - { name: permalink, label: Web address, type: string, required: true, description: "Starts and ends with /, lowercase words joined by hyphens, e.g. /services/product-data/. Don't change it once the page is live." }
      - { name: order, label: Order, type: number, description: "Position in footer and \"Explore more\" lists. Lower comes first." }
      - { name: cta_label, label: Button text, type: string }
      - { name: related_category, label: Related Insights category, type: string, description: "Insights notes with exactly this category are listed on the page, e.g. Pump Connect." }
      - { name: service_name, label: Service name for search engines, type: string, description: "Optional. Defaults to the page heading." }
      - { name: service_type, label: Type of service for search engines, type: string, description: "Optional. e.g. Pump selection software." }
      - { name: audience, label: Who it is for, type: string, description: "Optional. e.g. Pump manufacturers." }
      - { name: image, label: Image, type: image, description: "Optional. Landscape (16:9), at least 1200px wide." }
      - { name: image_alt, label: Image description, type: string, description: "Describe the image for screen readers and search engines." }
      - name: faqs
        label: Questions and answers
        type: object
        list: true
        description: "Shown at the end of the page and given to Google as FAQ data."
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text }
      - { name: published, label: Show on site, type: boolean, default: true }
      - { name: body, label: Page content, type: rich-text }

  # ---------------------------------------------------------------- Home page sections
  - name: hero
    label: "Home · Hero"
    type: file
    path: _data/home/hero.yml
    format: yaml
    fields:
      - { name: eyebrow, label: Eyebrow (small line above the headline), type: string }
      - { name: headline, label: Headline, type: string, required: true }
      - { name: headline_highlight, label: Headline — red part, type: string, description: "Shown in brand red after the headline." }
      - { name: lead, label: Intro paragraph, type: text }
      - { name: primary_label, label: Main button text, type: string }
      - { name: secondary_label, label: Second button text, type: string }
      - { name: tags, label: Tags, type: string, list: true }
      - { name: image, label: Hero image, type: image, description: "Optional. Leave empty to keep the animated illustration. 4:3 landscape works best." }
      - { name: image_alt, label: Hero image description, type: string }

  - name: trust
    label: "Home · Highlights band"
    type: file
    path: _data/home/trust.yml
    format: yaml
    fields:
      - name: items
        label: Highlights
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: string }

  - name: services
    label: "Home · Services"
    type: file
    path: _data/home/services.yml
    format: yaml
    fields:
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: title, label: Heading, type: string }
      - { name: intro, label: Intro, type: text }
      - name: items
        label: Services
        type: object
        list: true
        fields:
          - name: icon
            label: Icon
            type: select
            options:
              values:
                - { value: data, label: Product data }
                - { value: docs, label: Documentation }
                - { value: network, label: Dealer network }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: url, label: Link to page, type: string, description: "Optional. Web address of the matching page, e.g. /services/product-data/" }
          - { name: link_label, label: Link text, type: string, description: "Describe where the link goes, e.g. Product data consulting. Defaults to Learn more." }
      - name: upcoming
        label: Upcoming service banner
        type: object
        fields:
          - { name: show, label: Show banner, type: boolean }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: badge, label: Badge, type: string }

  - name: products
    label: "Home · Products"
    type: file
    path: _data/home/products.yml
    format: yaml
    fields:
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: title, label: Heading, type: string }
      - { name: intro, label: Intro, type: text }
      - name: featured
        label: Featured product
        type: object
        fields:
          - { name: tag, label: Tag, type: string }
          - { name: name, label: Name, type: string }
          - { name: text, label: Description, type: text }
          - { name: cta_label, label: Button text, type: string }
          - { name: url, label: Link to product page, type: string, description: "Optional. e.g. /pump-connect/" }
          - { name: image, label: Screenshot, type: image, description: "Optional. Replaces the spec card. 4:3 landscape works best." }
          - { name: image_alt, label: Screenshot description, type: string }
          - name: specs
            label: Spec card rows
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: value, label: Value, type: string }
              - { name: highlight, label: Highlight in red, type: boolean }
      - name: items
        label: Other products
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string }
          - { name: text, label: Description, type: text }

  - name: process
    label: "Home · How we work"
    type: file
    path: _data/home/process.yml
    format: yaml
    fields:
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: title, label: Heading, type: string }
      - { name: intro, label: Intro, type: text }
      - name: steps
        label: Steps
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }

  - name: industries
    label: "Home · Industries"
    type: file
    path: _data/home/industries.yml
    format: yaml
    fields:
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: title, label: Heading, type: string }
      - { name: intro, label: Intro, type: text }
      - name: items
        label: Industries
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - name: icon
            label: Icon
            type: select
            options:
              values:
                - { value: pump, label: Pump }
                - { value: mechanical, label: Mechanical }
                - { value: equipment, label: Equipment / plant }
          - { name: url, label: Link to page, type: string, description: "Optional. e.g. /industries/pump-manufacturers/" }
          - { name: link_label, label: Link text, type: string, description: "Describe where the link goes, e.g. Product data consulting. Defaults to Learn more." }
          - { name: image, label: Photo, type: image, description: "Optional. Replaces the icon. Wide images work best." }
          - { name: image_alt, label: Photo description, type: string }

  - name: why
    label: "Home · Why us"
    type: file
    path: _data/home/why.yml
    format: yaml
    fields:
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: title, label: Heading, type: string }
      - name: items
        label: Promises
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }

  - name: technology
    label: "Home · Technology partner"
    type: file
    path: _data/home/technology.yml
    format: yaml
    fields:
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: title, label: Heading, type: string }
      - { name: text, label: Text, type: text }
      - { name: cta_label, label: Button text, type: string }
      - { name: partner_name, label: Partner name, type: string }
      - { name: partner_byline, label: Partner byline, type: string }
      - { name: partner_logo, label: Partner logo, type: image, description: "Optional. Replaces the partner name. Keep it under 48px tall." }
      - { name: points, label: Points, type: string, list: true }

  - name: insights_section
    label: "Home · Insights section"
    type: file
    path: _data/home/insights.yml
    format: yaml
    fields:
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: title, label: Heading, type: string }
      - { name: intro, label: Intro, type: text }
      - { name: read_label, label: '"Read" link text', type: string }
      - { name: soon_label, label: '"Coming soon" text', type: string }

  - name: faq
    label: "Home · FAQ"
    type: file
    path: _data/home/faq.yml
    format: yaml
    fields:
      - { name: show, label: Show section, type: boolean }
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: title, label: Heading, type: string }
      - { name: intro, label: Intro, type: text }
      - name: items
        label: Questions
        type: object
        list: true
        fields:
          - { name: q, label: Question, type: string }
          - { name: a, label: Answer, type: text, description: "Plain sentences. Answer the question in the first sentence." }

  - name: contact
    label: "Home · Contact"
    type: file
    path: _data/home/contact.yml
    format: yaml
    fields:
      - { name: eyebrow, label: Eyebrow, type: string }
      - { name: title, label: Heading, type: string }
      - { name: lead, label: Intro, type: text }
      - { name: direct_title, label: Heading above contact details, type: string }
      - { name: email_label, label: Email label, type: string }
      - { name: phone_label, label: Phone label, type: string }
      - { name: address_label, label: Address label, type: string }
      - { name: map_label, label: Map link text, type: string }
      - { name: button_label, label: Send button text, type: string }
      - { name: sending_label, label: Button text while sending, type: string }
      - { name: form_note, label: Note under the button, type: string }
      - { name: success_message, label: Message after sending, type: text }
      - { name: error_message, label: Message if sending fails, type: text, description: "The email address is added after this automatically." }

  # ---------------------------------------------------------------- Settings
  - name: settings
    label: Site settings & SEO
    type: file
    path: _data/settings.yml
    format: yaml
    fields:
      - { name: site_name, label: Site name, type: string, required: true }
      - { name: email, label: Contact email, type: string, required: true, description: "Used in the contact section, footer and contact form." }
      - { name: phone, label: Mobile / phone number, type: string, description: "Include the country code, e.g. +91 98765 43210. Leave empty to hide." }
      - name: address
        label: Office address
        type: object
        description: Leave the street empty to hide the address.
        fields:
          - { name: street, label: Street address, type: text, description: "Building, street and area. Use a new line for each line." }
          - { name: city, label: City, type: string }
          - { name: region, label: State, type: string }
          - { name: postal_code, label: PIN / postal code, type: string }
          - { name: country, label: Country, type: string }
          - { name: map_url, label: Google Maps link, type: string, description: "Optional. Paste the Share link from Google Maps." }
      - { name: seo_title, label: Google title (home), type: string, description: "Keep under 60 characters." }
      - { name: seo_description, label: Google description (home), type: text, description: "Keep between 120 and 160 characters." }
      - { name: keywords, label: Keywords, type: string }
      - { name: expertise, label: Areas of expertise (for search engines), type: string, list: true }
      - { name: google_site_verification, label: Google Search Console code, type: string, description: "From Search Console → HTML tag. Paste only the content=\"…\" value." }
      - { name: bing_site_verification, label: Bing Webmaster code, type: string, description: "From Bing Webmaster Tools → HTML meta tag. Paste only the content=\"…\" value." }
      - { name: ga4_id, label: Google Analytics ID, type: string, description: "GA4 measurement ID, e.g. G-AB12CD34EF. Leave empty to turn analytics off." }
      - { name: social, label: Company profile links, type: string, list: true, description: "Full links to your LinkedIn, Clutch and other company profiles." }
      - { name: share_title, label: Social share title, type: string }
      - { name: share_description, label: Social share description, type: text }
      - { name: og_image, label: Social share image, type: image, description: "1200 × 630 px PNG or JPG." }
      - { name: og_image_alt, label: Social share image description, type: string }
      - name: nav
        label: Menu
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - name: target
            label: Section
            type: select
            options:
              values:
                - { value: services, label: Services }
                - { value: products, label: Products }
                - { value: process, label: How we work }
                - { value: industries, label: Industries }
                - { value: why, label: Why us }
                - { value: technology, label: Technology }
                - { value: insights, label: Insights }
                - { value: faq, label: FAQ }
                - { value: contact, label: Contact }
      - { name: form_endpoint, label: Contact form endpoint, type: string, description: "Where enquiries are sent. Default: https://formsubmit.co/ajax/hello@made-o.com" }
      - { name: form_access_key, label: Contact form access key, type: string, description: "Only needed for Web3Forms." }
      - { name: cta_label, label: Header button text, type: string }
      - { name: footer_text, label: Footer text, type: text }
